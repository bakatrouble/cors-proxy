[package]
name = "cors-proxy"
version = "0.1.0"
edition = "2021"
description = "Lightweight streaming CORS proxy (X-Target-URL header, follows redirects)"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
